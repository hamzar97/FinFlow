server:
  port: 8702
spring:
  application:
    name: auth
  data:
    mongodb:
      host: localhost
      port: 27017
      database: FinFlow
springdoc:
  api-docs:
    path: /api-docs
eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true